<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 432" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bottleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8c3b8"/>
      <stop offset="40%" stop-color="#e2ddd2"/>
      <stop offset="100%" stop-color="#cac5ba"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ede8dd"/>
      <stop offset="100%" stop-color="#e4dfd4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="432" fill="#f5f1e9"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="406" rx="42" ry="10" fill="#b8b2a8" opacity="0.2"/>

  <!-- Dropper bottle body — slimmer than 30ml -->
  <rect x="166" y="172" width="68" height="214" rx="7" fill="url(#bottleGrad)" stroke="#b8b2a6" stroke-width="1.2"/>

  <!-- Shoulder -->
  <path d="M166 172 C166 150 177 139 200 136 C223 139 234 150 234 172Z" fill="#d4cfc5" stroke="#b8b2a6" stroke-width="1.2"/>

  <!-- Neck -->
  <rect x="188" y="86" width="24" height="52" rx="3" fill="#cac5bb" stroke="#b8b2a6" stroke-width="1.2"/>

  <!-- Dropper bulb + pipette -->
  <ellipse cx="200" cy="78" rx="18" ry="12" fill="#8a9680" stroke="#788470" stroke-width="1"/>
  <ellipse cx="200" cy="74" rx="18" ry="12" fill="#9aa688"/>
  <line x1="200" y1="62" x2="200" y2="44" stroke="#7a8670" stroke-width="2.5" stroke-linecap="round"/>
  <!-- dropper tip -->
  <path d="M198 44 L200 36 L202 44Z" fill="#9a9590"/>

  <!-- Label -->
  <rect x="174" y="208" width="52" height="88" rx="3" fill="url(#labelGrad)" stroke="#cac5ba" stroke-width="0.8"/>
  <text x="200" y="232" text-anchor="middle" font-family="Georgia,serif" font-size="6.5" fill="#8a8478" letter-spacing="2.5" opacity="0.9">SUKOON</text>
  <line x1="180" y1="238" x2="220" y2="238" stroke="#cac5ba" stroke-width="0.6" opacity="0.8"/>
  <text x="200" y="250" text-anchor="middle" font-family="Georgia,serif" font-size="5" fill="#9a9490" letter-spacing="2" opacity="0.8">DAILY SOLACE</text>
  <text x="200" y="261" text-anchor="middle" font-family="Georgia,serif" font-size="4.5" fill="#9a9490" letter-spacing="1.5" opacity="0.7">FLUID</text>
  <line x1="181" y1="268" x2="219" y2="268" stroke="#cac5ba" stroke-width="0.5" opacity="0.6"/>
  <text x="200" y="280" text-anchor="middle" font-family="Georgia,serif" font-size="4.5" fill="#aaa49a" letter-spacing="1" opacity="0.7">15 ml · 0.5 fl oz</text>

  <!-- Highlight -->
  <rect x="170" y="178" width="7" height="130" rx="3.5" fill="white" opacity="0.18"/>
</svg>
