<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f0ece2"/>
      <stop offset="100%" stop-color="#e4ddd2"/>
    </radialGradient>
    <linearGradient id="btl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8bcaa"/>
      <stop offset="25%" stop-color="#e6dece"/>
      <stop offset="68%" stop-color="#d8d0bc"/>
      <stop offset="100%" stop-color="#a89880"/>
    </linearGradient>
    <filter id="drop"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a120a" flood-opacity="0.16"/></filter>
  </defs>

  <rect width="400" height="480" fill="url(#bg)"/>

  <!-- Dropper bottle -->
  <g filter="url(#drop)" transform="translate(156, 60)">
    <!-- Body -->
    <rect x="0" y="78" width="88" height="300" rx="9" fill="url(#btl)"/>
    <rect x="9" y="92" width="11" height="276" rx="5.5" fill="white" opacity="0.2"/>
    <rect x="24" y="92" width="4" height="276" rx="2" fill="white" opacity="0.09"/>
    <rect x="77" y="78" width="11" height="300" rx="5.5" fill="#907e66" opacity="0.26"/>
    <!-- Shoulder -->
    <path d="M0 78 Q0 54 12 44 L76 44 Q88 54 88 78Z" fill="url(#btl)"/>
    <!-- Bulb -->
    <ellipse cx="44" cy="28" rx="28" ry="20" fill="#4a5844"/>
    <ellipse cx="44" cy="22" rx="22" ry="16" fill="#566654"/>
    <!-- Pipette -->
    <rect x="41" y="-42" width="6" height="52" rx="3" fill="#606e58"/>
    <ellipse cx="44" cy="-42" rx="3" ry="2" fill="#506048"/>
    <!-- Label -->
    <rect x="10" y="148" width="68" height="160" rx="4" fill="#faf6ee" opacity="0.96"/>
    <text x="44" y="183" font-family="Georgia,serif" font-size="9" fill="#2a2418" text-anchor="middle" letter-spacing="4">SUKOON</text>
    <line x1="14" y1="190" x2="74" y2="190" stroke="#2a2418" stroke-width="0.5" opacity="0.32"/>
    <text x="44" y="208" font-family="Georgia,serif" font-size="6" fill="#4a4030" text-anchor="middle" letter-spacing="2">DAILY SOLACE</text>
    <text x="44" y="222" font-family="Georgia,serif" font-size="6" fill="#4a4030" text-anchor="middle" letter-spacing="1.5">FLUID</text>
    <!-- Plant -->
    <path d="M38 264 C38 252 44 240 44 228" stroke="#6a5e46" stroke-width="0.9" fill="none"/>
    <path d="M38 259 C32 250 30 241 35 237 C39 243 39 253 38 259Z" fill="#6a5e46" opacity="0.62"/>
    <path d="M38 265 C44 256 46 247 41 243 C37 249 37 259 38 265Z" fill="#6a5e46" opacity="0.62"/>
    <text x="44" y="280" font-family="Georgia,serif" font-size="5.5" fill="#8a7a60" text-anchor="middle" letter-spacing="1">15 ML / 0.5 FL. OZ.</text>
  </g>

  <ellipse cx="200" cy="420" rx="50" ry="9" fill="#1a120a" opacity="0.1"/>
</svg>
