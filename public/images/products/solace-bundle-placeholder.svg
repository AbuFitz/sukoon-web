<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f0ece2"/>
      <stop offset="100%" stop-color="#e4ddd2"/>
    </radialGradient>
    <linearGradient id="btl1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cdc0aa"/>
      <stop offset="22%" stop-color="#ede4d2"/>
      <stop offset="65%" stop-color="#e2d8c4"/>
      <stop offset="100%" stop-color="#b0a088"/>
    </linearGradient>
    <linearGradient id="btl2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4b8a4"/>
      <stop offset="25%" stop-color="#e4dccb"/>
      <stop offset="100%" stop-color="#a89880"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4e5a46"/>
      <stop offset="50%" stop-color="#6a7860"/>
      <stop offset="100%" stop-color="#404c3a"/>
    </linearGradient>
    <filter id="d1"><feDropShadow dx="-4" dy="12" stdDeviation="14" flood-color="#1a120a" flood-opacity="0.2"/></filter>
    <filter id="d2"><feDropShadow dx="4" dy="12" stdDeviation="14" flood-color="#1a120a" flood-opacity="0.16"/></filter>
  </defs>

  <rect width="400" height="480" fill="url(#bg)"/>

  <!-- Back bottle (30ml) — left -->
  <g filter="url(#d1)" transform="translate(88, 50)" opacity="0.88">
    <rect x="0" y="62" width="90" height="310" rx="10" fill="url(#btl1)"/>
    <rect x="9" y="76" width="11" height="284" rx="5.5" fill="white" opacity="0.18"/>
    <rect x="79" y="62" width="11" height="310" rx="5.5" fill="#8a7a60" opacity="0.26"/>
    <path d="M0 62 Q0 40 13 32 L77 32 Q90 40 90 62Z" fill="url(#btl1)"/>
    <rect x="7" y="0" width="76" height="38" rx="7" fill="url(#cap)"/>
    <rect x="10" y="128" width="70" height="164" rx="3" fill="#faf6ee" opacity="0.9"/>
    <text x="45" y="164" font-family="Georgia,serif" font-size="8.5" fill="#2a2418" text-anchor="middle" letter-spacing="4">SUKOON</text>
    <line x1="14" y1="171" x2="76" y2="171" stroke="#2a2418" stroke-width="0.4" opacity="0.3"/>
    <text x="45" y="187" font-family="Georgia,serif" font-size="5.5" fill="#4a4030" text-anchor="middle" letter-spacing="2">DAILY SOLACE</text>
    <text x="45" y="200" font-family="Georgia,serif" font-size="5.5" fill="#4a4030" text-anchor="middle" letter-spacing="1">FLUID · 30 ML</text>
  </g>

  <!-- Front bottle (15ml dropper) — right -->
  <g filter="url(#d2)" transform="translate(218, 100)">
    <rect x="0" y="68" width="76" height="268" rx="8" fill="url(#btl2)"/>
    <rect x="8" y="80" width="9" height="248" rx="4.5" fill="white" opacity="0.19"/>
    <rect x="67" y="68" width="9" height="268" rx="4.5" fill="#8a7a62" opacity="0.24"/>
    <path d="M0 68 Q0 48 11 40 L65 40 Q76 48 76 68Z" fill="url(#btl2)"/>
    <ellipse cx="38" cy="24" rx="24" ry="17" fill="#4a5844"/>
    <ellipse cx="38" cy="18" rx="19" ry="13" fill="#566654"/>
    <rect x="35" y="-38" width="6" height="48" rx="3" fill="#606e58"/>
    <rect x="9" y="130" width="58" height="140" rx="3" fill="#faf6ee" opacity="0.93"/>
    <text x="38" y="163" font-family="Georgia,serif" font-size="7.5" fill="#2a2418" text-anchor="middle" letter-spacing="3.5">SUKOON</text>
    <line x1="13" y1="170" x2="63" y2="170" stroke="#2a2418" stroke-width="0.4" opacity="0.3"/>
    <text x="38" y="186" font-family="Georgia,serif" font-size="5" fill="#4a4030" text-anchor="middle" letter-spacing="1.8">DAILY SOLACE</text>
    <text x="38" y="198" font-family="Georgia,serif" font-size="5" fill="#4a4030" text-anchor="middle" letter-spacing="1">FLUID · 15 ML</text>
  </g>

  <!-- Botanical sprig -->
  <g opacity="0.5" transform="translate(80, 370)">
    <path d="M0 60 C5 42 12 24 18 6" stroke="#5a4e38" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M18 6 C11 0 4 4 2 11 C8 16 17 12 18 6Z" fill="#5a4e38"/>
    <path d="M16 20 C23 14 28 18 26 26 C20 30 15 26 16 20Z" fill="#5a4e38" opacity="0.75"/>
    <path d="M13 36 C5 30 1 35 2 42 C8 47 14 43 13 36Z" fill="#5a4e38" opacity="0.65"/>
    <path d="M10 52 C18 46 23 51 21 58 C15 62 10 58 10 52Z" fill="#5a4e38" opacity="0.55"/>
  </g>

  <ellipse cx="200" cy="434" rx="76" ry="11" fill="#1a120a" opacity="0.1"/>
</svg>
