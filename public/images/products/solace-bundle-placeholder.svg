    <rect x="248" y="106" width="20" height="50" rx="3" fill="#cac5bb" stroke="#b8b2a8" stroke-width="1.2"/>
    <ellipse cx="258" cy="97" rx="16" ry="11" fill="#8a9680" stroke="#788470" stroke-width="1"/>
    <ellipse cx="258" cy="93" rx="16" ry="11" fill="#9aa688"/>
    <line x1="258" y1="82" x2="258" y2="64" stroke="#7a8670" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M256 64 L258 56 L260 64Z" fill="#9a9590"/>
