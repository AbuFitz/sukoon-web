<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 432" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4bfb4"/>
      <stop offset="50%" stop-color="#dedad0"/>
      <stop offset="100%" stop-color="#c8c3b8"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cac5ba"/>
      <stop offset="50%" stop-color="#e0dbd0"/>
