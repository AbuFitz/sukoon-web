  <ellipse cx="264" cy="408" rx="28" ry="7" fill="#b8b2a8" opacity="0.15"/>

  <!-- Back bottle (30ml) — slightly left, nudged back -->
  <g opacity="0.72">
    <rect x="134" y="138" width="88" height="258" rx="7" fill="url(#b1)" stroke="#b0aaa0" stroke-width="1"/>
    <path d="M134 138 C134 113 147 100 178 96 C209 100 222 113 222 138Z" fill="#ccc7bc" stroke="#b0aaa0" stroke-width="1"/>
    <rect x="168" y="48" width="20" height="50" rx="3" fill="#c8c3b8" stroke="#b0aaa0" stroke-width="1"/>
    <rect x="163" y="36" width="30" height="15" rx="3" fill="#5e6e56" stroke="#4e5e48" stroke-width="0.9"/>
    <rect x="144" y="178" width="68" height="100" rx="3" fill="url(#lbl)" stroke="#c8c3b8" stroke-width="0.7" opacity="0.8"/>
    <text x="178" y="204" text-anchor="middle" font-family="Georgia,serif" font-size="6.5" fill="#8a8478" letter-spacing="2.5" opacity="0.9">SUKOON</text>
