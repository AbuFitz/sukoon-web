    <text x="258" y="262" text-anchor="middle" font-family="Georgia,serif" font-size="4.5" fill="#9a9490" letter-spacing="1.5" opacity="0.8">DAILY SOLACE</text>
    <text x="258" y="272" text-anchor="middle" font-family="Georgia,serif" font-size="4" fill="#9a9490" letter-spacing="1.2" opacity="0.7">FLUID</text>
    <line x1="242" y1="279" x2="274" y2="279" stroke="#cac5ba" stroke-width="0.5" opacity="0.55"/>
    <text x="258" y="289" text-anchor="middle" font-family="Georgia,serif" font-size="4" fill="#aaa49a" letter-spacing="0.8" opacity="0.7">15 ml</text>
    <rect x="232" y="194" width="6" height="120" rx="3" fill="white" opacity="0.17"/>
