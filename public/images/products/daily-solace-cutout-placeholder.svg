<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 400" fill="none">
  <!-- Bottle body -->
  <rect x="38" y="120" width="84" height="240" rx="12" fill="#e8e3d8" stroke="#3F4A36" stroke-width="1.5" opacity="0.9"/>
  <!-- Bottle shoulder -->
  <path d="M 38 148 C 38 132 42 120 48 120 L 112 120 C 118 120 122 132 122 148" fill="#ddd8ce" stroke="#3F4A36" stroke-width="1.5" opacity="0.9"/>
  <!-- Neck -->
  <rect x="60" y="80" width="40" height="44" rx="6" fill="#e8e3d8" stroke="#3F4A36" stroke-width="1.5" opacity="0.9"/>
  <!-- Cap -->
  <rect x="54" y="52" width="52" height="34" rx="8" fill="#3F4A36" opacity="0.8"/>
  <!-- Dropper tip -->
  <rect x="77" y="28" width="6" height="28" rx="3" fill="#3F4A36" opacity="0.7"/>
  <!-- Label area -->
  <rect x="50" y="170" width="60" height="140" rx="3" fill="white" opacity="0.6"/>
  <!-- Label text lines -->
  <line x1="58" y1="196" x2="102" y2="196" stroke="#3F4A36" stroke-width="1" opacity="0.4"/>
  <line x1="62" y1="206" x2="98" y2="206" stroke="#3F4A36" stroke-width="0.7" opacity="0.3"/>
  <line x1="64" y1="214" x2="96" y2="214" stroke="#3F4A36" stroke-width="0.7" opacity="0.3"/>
  <!-- Sukoon text placeholder -->
  <text x="80" y="188" text-anchor="middle" font-size="7" fill="#3F4A36" opacity="0.6" font-family="serif" letter-spacing="2">SUKOON</text>
  <!-- Volume -->
  <text x="80" y="295" text-anchor="middle" font-size="6" fill="#3F4A36" opacity="0.4" font-family="sans-serif">30ml</text>
  <!-- Subtle reflection -->
  <rect x="46" y="130" width="8" height="220" rx="4" fill="white" opacity="0.12"/>
</svg>
