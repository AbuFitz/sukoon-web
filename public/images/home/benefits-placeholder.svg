<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#b8a890"/>
      <stop offset="50%" stop-color="#9a8a72"/>
      <stop offset="100%" stop-color="#60503c"/>
    </radialGradient>
    <radialGradient id="light" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#e4d8c0" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#e4d8c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a120a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a120a" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="700" height="900" fill="url(#bg)"/>
  <ellipse cx="320" cy="380" rx="360" ry="440" fill="url(#light)" filter="url(#blur)"/>

  <!-- Graceful hand/arm suggestion — abstract warm silhouette -->
  <path d="M 180 900 C 180 820 200 750 230 690 C 255 640 290 600 310 560 C 325 530 330 500 320 470 C 312 446 296 432 290 414 C 282 392 290 370 308 358 C 324 348 345 350 360 360"
        stroke="#2a1e12" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.35"/>

  <!-- Large botanical branch — atmospheric, right side -->
  <g opacity="0.25" stroke="#f0e4cc" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 640 -20 C 600 80 560 180 510 300 C 468 400 440 490 420 600"/>
    <path d="M 574 62 C 610 28 656 16 672 50 C 648 82 602 86 574 62Z" fill="#f0e4cc" opacity="0.8" stroke="none"/>
    <path d="M 540 112 C 506 78 470 84 460 116 C 476 140 514 134 540 112Z" fill="#f0e4cc" opacity="0.7" stroke="none"/>
    <path d="M 512 174 C 548 138 584 148 582 182 C 560 202 524 194 512 174Z" fill="#f0e4cc" opacity="0.65" stroke="none"/>
    <path d="M 484 242 C 448 214 420 224 416 256 C 434 278 470 270 484 242Z" fill="#f0e4cc" opacity="0.6" stroke="none"/>
    <path d="M 458 314 C 494 284 524 298 520 330 C 500 348 466 338 458 314Z" fill="#f0e4cc" opacity="0.55" stroke="none"/>
    <path d="M 438 390 C 400 366 378 378 377 408 C 393 428 428 420 438 390Z" fill="#f0e4cc" opacity="0.5" stroke="none"/>
  </g>

  <!-- Bottom left botanical -->
  <g opacity="0.2" stroke="#f0e4cc" stroke-width="1.1" fill="none" stroke-linecap="round">
    <path d="M 60 900 C 80 840 100 780 120 720 C 140 660 165 610 185 560"/>
    <path d="M 75 865 C 46 832 38 802 58 782 C 82 786 96 818 75 865Z" fill="#f0e4cc" opacity="0.7" stroke="none"/>
    <path d="M 100 818 C 124 790 142 796 140 818 C 126 834 102 828 100 818Z" fill="#f0e4cc" opacity="0.6" stroke="none"/>
    <path d="M 122 776 C 96 754 84 762 84 782 C 96 796 118 790 122 776Z" fill="#f0e4cc" opacity="0.5" stroke="none"/>
  </g>

  <!-- Oil droplets suggestion — simple elegant dots -->
  <circle cx="310" cy="440" r="6" fill="#f5e8d0" opacity="0.6"/>
  <circle cx="326" cy="420" r="4" fill="#f5e8d0" opacity="0.5"/>
  <circle cx="298" cy="460" r="3" fill="#f5e8d0" opacity="0.4"/>

  <!-- Small bottle outline — very minimal, right center -->
  <g opacity="0.28" transform="translate(440, 550)">
    <rect x="0" y="50" width="52" height="280" rx="8" stroke="#f0e4cc" stroke-width="1.2" fill="none"/>
    <path d="M0 50 Q0 32 9 24 L43 24 Q52 32 52 50Z" stroke="#f0e4cc" stroke-width="1.2" fill="none"/>
    <rect x="7" y="0" width="38" height="30" rx="5" stroke="#f0e4cc" stroke-width="1" fill="none"/>
    <line x1="8" y1="140" x2="44" y2="140" stroke="#f0e4cc" stroke-width="0.6" opacity="0.6"/>
    <text x="26" y="130" font-family="Georgia,serif" font-size="7" fill="#f0e4cc" text-anchor="middle" letter-spacing="2.5" opacity="0.8">SUKOON</text>
  </g>

  <rect width="700" height="900" fill="url(#vignette)"/>
