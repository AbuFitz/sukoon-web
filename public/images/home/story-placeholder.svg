<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="45%" cy="55%" r="68%">
      <stop offset="0%" stop-color="#c2b8a2"/>
      <stop offset="45%" stop-color="#a8987e"/>
      <stop offset="100%" stop-color="#6e5e4a"/>
    </radialGradient>
    <radialGradient id="light" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#e8ddc8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e8ddc8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a120a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a120a" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0b09a"/>
      <stop offset="100%" stop-color="#8a7a62"/>
    </linearGradient>
    <linearGradient id="bottleG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d0c4ae"/>
      <stop offset="25%" stop-color="#ece4d2"/>
      <stop offset="70%" stop-color="#ddd4c0"/>
      <stop offset="100%" stop-color="#b0a088"/>
    </linearGradient>
    <linearGradient id="capG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#505a48"/>
      <stop offset="50%" stop-color="#6e7a64"/>
      <stop offset="100%" stop-color="#424e3c"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="drop"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1a120a" flood-opacity="0.3"/></filter>
  </defs>

  <rect width="900" height="660" fill="url(#bg)"/>
  <ellipse cx="430" cy="260" rx="420" ry="320" fill="url(#light)" filter="url(#blur)"/>

  <!-- Table surface line -->
  <rect x="0" y="420" width="900" height="240" fill="url(#tableGrad)" opacity="0.35"/>
  <line x1="0" y1="420" x2="900" y2="420" stroke="#c8b898" stroke-width="1" opacity="0.4"/>

  <!-- Cloth fold suggestion -->
  <path d="M 200 420 C 220 410 230 400 240 420" stroke="#c0b09a" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 160 430 C 175 418 185 412 195 430" stroke="#c0b09a" stroke-width="1" fill="none" opacity="0.35"/>

  <!-- Main bottle (tall) -->
  <g filter="url(#drop)" transform="translate(340, 100)">
    <rect x="0" y="70" width="90" height="480" rx="10" fill="url(#bottleG)"/>
    <!-- Highlight -->
    <rect x="10" y="88" width="12" height="450" rx="6" fill="white" opacity="0.18"/>
    <rect x="26" y="88" width="4" height="450" rx="2" fill="white" opacity="0.08"/>
    <!-- Shadow edge -->
    <rect x="78" y="70" width="12" height="480" rx="6" fill="#8a7a60" opacity="0.3"/>
    <!-- Shoulder -->
    <path d="M0 70 Q0 44 14 36 L76 36 Q90 44 90 70Z" fill="url(#bottleG)"/>
    <!-- Cap -->
    <rect x="7" y="0" width="76" height="42" rx="7" fill="url(#capG)"/>
    <rect x="13" y="5" width="10" height="32" rx="5" fill="white" opacity="0.14"/>
    <!-- Label -->
    <rect x="10" y="160" width="70" height="200" rx="4" fill="#faf6ee" opacity="0.94"/>
    <text x="45" y="200" font-family="Georgia,serif" font-size="9" fill="#2a2418" text-anchor="middle" letter-spacing="4">SUKOON</text>
    <line x1="14" y1="207" x2="76" y2="207" stroke="#2a2418" stroke-width="0.5" opacity="0.35"/>
    <text x="45" y="224" font-family="Georgia,serif" font-size="6" fill="#4a4030" text-anchor="middle" letter-spacing="2">DAILY SOLACE</text>
    <text x="45" y="238" font-family="Georgia,serif" font-size="6" fill="#4a4030" text-anchor="middle" letter-spacing="1.5">FLUID · 30 ML</text>
    <!-- Mini plant on label -->
    <path d="M39 290 C39 275 45 262 45 248" stroke="#6a5e46" stroke-width="0.8" fill="none"/>
    <path d="M39 283 C33 274 31 264 36 260 C40 266 40 276 39 283Z" fill="#6a5e46" opacity="0.6"/>
    <path d="M39 289 C45 280 47 270 42 266 C38 272 38 282 39 289Z" fill="#6a5e46" opacity="0.6"/>
    <text x="45" y="308" font-family="Georgia,serif" font-size="5.5" fill="#8a7a60" text-anchor="middle" letter-spacing="1">1 FL. OZ.</text>
  </g>

  <!-- Small jar/dropper -->
  <g transform="translate(462, 260)" opacity="0.9">
    <rect x="0" y="50" width="52" height="310" rx="7" fill="#d2c8b2"/>
    <rect x="6" y="62" width="8" height="290" rx="4" fill="white" opacity="0.16"/>
    <rect x="44" y="50" width="8" height="310" rx="4" fill="#907e64" opacity="0.28"/>
    <path d="M0 50 Q0 32 9 26 L43 26 Q52 32 52 50Z" fill="#ccc2ac"/>
    <ellipse cx="26" cy="17" rx="15" ry="11" fill="#4e5a46"/>
    <rect x="23" y="-28" width="5" height="38" rx="2.5" fill="#647060"/>
    <!-- Label -->
    <rect x="7" y="100" width="38" height="130" rx="3" fill="#faf6ee" opacity="0.9"/>
    <text x="26" y="124" font-family="Georgia,serif" font-size="5.5" fill="#2a2418" text-anchor="middle" letter-spacing="2.5">SUKOON</text>
    <line x1="11" y1="130" x2="41" y2="130" stroke="#2a2418" stroke-width="0.4" opacity="0.3"/>
    <text x="26" y="144" font-family="Georgia,serif" font-size="4.5" fill="#4a4030" text-anchor="middle" letter-spacing="1.5">DAILY SOLACE</text>
    <text x="26" y="156" font-family="Georgia,serif" font-size="4.5" fill="#4a4030" text-anchor="middle" letter-spacing="1">FLUID · 15ML</text>
  </g>

  <!-- Botanical sprig -->
  <g opacity="0.6" transform="translate(290, 370)">
    <path d="M0 80 C6 55 14 32 20 8" stroke="#5a4e36" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <path d="M20 8 C13 1 5 4 2 13 C9 19 19 14 20 8Z" fill="#5a4e36"/>
    <path d="M18 22 C26 15 32 19 30 28 C24 33 17 28 18 22Z" fill="#5a4e36" opacity="0.8"/>
    <path d="M15 40 C6 33 2 38 3 46 C10 51 17 46 15 40Z" fill="#5a4e36" opacity="0.72"/>
    <path d="M12 57 C21 50 27 55 24 63 C18 67 12 63 12 57Z" fill="#5a4e36" opacity="0.65"/>
    <path d="M10 74 C1 68 -3 74 -2 81 C5 86 12 82 10 74Z" fill="#5a4e36" opacity="0.55"/>
  </g>

  <!-- Pebbles -->
  <ellipse cx="520" cy="434" rx="16" ry="9" fill="#9a8a70" opacity="0.55"/>
  <ellipse cx="540" cy="440" rx="11" ry="6.5" fill="#887866" opacity="0.5"/>
  <ellipse cx="506" cy="438" rx="9" ry="5.5" fill="#a09080" opacity="0.45"/>

  <rect width="900" height="660" fill="url(#shadow)"/>
</svg>
