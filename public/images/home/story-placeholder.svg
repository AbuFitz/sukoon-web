<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cdc8be"/>
      <stop offset="100%" stop-color="#ddd8ce"/>
    </linearGradient>
    <radialGradient id="soft" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#e4dfd5" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#c8c3b9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="650" fill="url(#bg)"/>
  <rect width="800" height="650" fill="url(#soft)"/>

  <!-- Surface line -->
  <rect x="0" y="440" width="800" height="210" fill="#b8b3a9" opacity="0.25"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#a8a39a" stroke-width="0.8" opacity="0.35"/>

  <!-- Main tall bottle -->
  <g opacity="0.6">
    <rect x="300" y="165" width="66" height="228" rx="5" fill="#d4cfc5" stroke="#a8a398" stroke-width="1.2"/>
    <path d="M300 165 C300 145 313 135 333 131 C353 135 366 145 366 165Z" fill="#cac5bb" stroke="#a8a398" stroke-width="1.2"/>
    <rect x="325" y="92" width="18" height="42" rx="3" fill="#cac5bb" stroke="#a8a398" stroke-width="1.2"/>
    <rect x="321" y="83" width="26" height="12" rx="2" fill="#7a8870" stroke="#687558" stroke-width="0.9"/>
    <!-- label -->
    <rect x="310" y="205" width="46" height="68" rx="2" fill="#ece7dc" opacity="0.75"/>
    <line x1="318" y1="222" x2="348" y2="222" stroke="#b0a89e" stroke-width="0.8" opacity="0.9"/>
    <line x1="318" y1="232" x2="346" y2="232" stroke="#b0a89e" stroke-width="0.8" opacity="0.8"/>
    <line x1="318" y1="242" x2="342" y2="242" stroke="#b0a89e" stroke-width="0.7" opacity="0.6"/>
    <line x1="318" y1="252" x2="344" y2="252" stroke="#b0a89e" stroke-width="0.7" opacity="0.5"/>
    <!-- highlight -->
    <rect x="306" y="172" width="7" height="110" rx="3.5" fill="white" opacity="0.16"/>
  </g>

  <!-- Dropper bottle right -->
  <g opacity="0.5">
    <rect x="410" y="258" width="42" height="152" rx="5" fill="#d8d3c9" stroke="#a8a398" stroke-width="1"/>
    <path d="M410 258 C410 242 418 234 431 231 C444 234 452 242 452 258Z" fill="#cec9bf" stroke="#a8a398" stroke-width="1"/>
    <rect x="424" y="198" width="14" height="36" rx="2" fill="#cec9bf" stroke="#a8a398" stroke-width="1"/>
    <line x1="431" y1="198" x2="431" y2="178" stroke="#9a9590" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="431" cy="176" rx="4" ry="3" fill="#9a9590"/>
    <rect x="418" y="193" width="26" height="9" rx="2" fill="#7a8870" stroke="#687558" stroke-width="0.8"/>
    <rect x="416" y="290" width="30" height="46" rx="2" fill="#ece7dc" opacity="0.7"/>
    <line x1="422" y1="305" x2="440" y2="305" stroke="#b0a89e" stroke-width="0.7" opacity="0.8"/>
    <line x1="422" y1="313" x2="438" y2="313" stroke="#b0a89e" stroke-width="0.7" opacity="0.6"/>
  </g>

  <!-- Dried botanical sprig leaning left -->
  <g opacity="0.32" stroke="#7a7260" stroke-linecap="round" fill="none">
    <line x1="248" y1="440" x2="276" y2="188" stroke-width="1.4"/>
    <ellipse cx="260" cy="360" rx="17" ry="7" transform="rotate(-18 260 360)" fill="#8a8278" fill-opacity="0.55" stroke-width="0"/>
    <ellipse cx="267" cy="300" rx="15" ry="6" transform="rotate(12 267 300)" fill="#8a8278" fill-opacity="0.5" stroke-width="0"/>
    <ellipse cx="272" cy="248" rx="13" ry="5" transform="rotate(-6 272 248)" fill="#8a8278" fill-opacity="0.5" stroke-width="0"/>
    <line x1="265" y1="320" x2="248" y2="304" stroke-width="0.9"/>
    <line x1="270" y1="270" x2="285" y2="255" stroke-width="0.9"/>
  </g>

  <!-- Stone / pebble -->
  <ellipse cx="400" cy="462" rx="34" ry="18" fill="#c8c3b9" opacity="0.45"/>
  <ellipse cx="400" cy="458" rx="34" ry="18" fill="#d4cfc5" opacity="0.3"/>

  <!-- Soft shadows -->
  <ellipse cx="333" cy="452" rx="44" ry="9" fill="#9a9590" opacity="0.14"/>
  <ellipse cx="431" cy="452" rx="28" ry="7" fill="#9a9590" opacity="0.11"/>
</svg>
