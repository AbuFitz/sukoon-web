<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8c3b8"/>
      <stop offset="100%" stop-color="#d8d3c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#e0dbd0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c4bfb4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="430" fill="url(#bg)"/>
  <rect width="720" height="430" fill="url(#glow)"/>

  <!-- Surface -->
  <rect x="0" y="320" width="720" height="110" fill="#b8b3a8" opacity="0.22"/>
  <line x1="0" y1="320" x2="720" y2="320" stroke="#a8a39a" stroke-width="0.7" opacity="0.3"/>

  <!-- Linen / cloth fold -->
  <path d="M0 320 C80 314 140 326 220 318 C300 310 360 322 440 318 C520 314 620 324 720 318 L720 360 L0 360Z" fill="#d0cbc0" opacity="0.3"/>

  <!-- Main bottle — left of centre -->
  <g opacity="0.62">
    <rect x="258" y="88" width="62" height="210" rx="5" fill="#d4cfc5" stroke="#a8a398" stroke-width="1.1"/>
    <path d="M258 88 C258 70 270 60 289 57 C308 60 320 70 320 88Z" fill="#cac5bb" stroke="#a8a398" stroke-width="1.1"/>
    <rect x="281" y="24" width="16" height="36" rx="3" fill="#cac5bb" stroke="#a8a398" stroke-width="1.1"/>
    <rect x="277" y="16" width="24" height="11" rx="2" fill="#7a8870" stroke="#687558" stroke-width="0.9"/>
    <rect x="266" y="128" width="46" height="62" rx="2" fill="#ece7dc" opacity="0.75"/>
    <line x1="273" y1="144" x2="305" y2="144" stroke="#b0a89e" stroke-width="0.8" opacity="0.9"/>
    <line x1="273" y1="153" x2="303" y2="153" stroke="#b0a89e" stroke-width="0.8" opacity="0.8"/>
    <line x1="273" y1="162" x2="299" y2="162" stroke="#b0a89e" stroke-width="0.7" opacity="0.6"/>
    <rect x="255" y="94" width="6" height="100" rx="3" fill="white" opacity="0.15"/>
  </g>

  <!-- Small jar — right side -->
  <g opacity="0.46">
    <ellipse cx="430" cy="290" rx="44" ry="14" fill="#c0bab2" opacity="0.5"/>
    <rect x="386" y="226" width="88" height="66" rx="6" fill="#d0cbc1" stroke="#a8a398" stroke-width="1"/>
    <ellipse cx="430" cy="226" rx="44" ry="14" fill="#dad5cb" stroke="#a8a398" stroke-width="1"/>
    <ellipse cx="430" cy="226" rx="44" ry="14" fill="#e4dfd5" opacity="0.5"/>
    <!-- lid label -->
    <ellipse cx="430" cy="226" rx="30" ry="9" fill="#ece7dc" opacity="0.7"/>
    <line x1="418" y1="225" x2="442" y2="225" stroke="#b0a89e" stroke-width="0.7" opacity="0.8"/>
    <!-- jar label -->
    <rect x="396" y="238" width="68" height="42" rx="2" fill="#ece7dc" opacity="0.55"/>
    <line x1="404" y1="252" x2="454" y2="252" stroke="#b0a89e" stroke-width="0.7" opacity="0.7"/>
    <line x1="404" y1="261" x2="450" y2="261" stroke="#b0a89e" stroke-width="0.7" opacity="0.55"/>
    <rect x="388" y="230" width="4" height="48" rx="2" fill="white" opacity="0.12"/>
  </g>

