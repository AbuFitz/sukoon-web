    <ellipse cx="204" cy="248" rx="15" ry="6" transform="rotate(-22 204 248)" fill="#8a8278" fill-opacity="0.6" stroke-width="0"/>
    <ellipse cx="209" cy="195" rx="13" ry="5" transform="rotate(14 209 195)" fill="#8a8278" fill-opacity="0.55" stroke-width="0"/>
    <ellipse cx="213" cy="150" rx="11" ry="5" transform="rotate(-5 213 150)" fill="#8a8278" fill-opacity="0.5" stroke-width="0"/>
    <line x1="207" y1="220" x2="192" y2="205" stroke-width="0.9"/>
    <line x1="210" y1="172" x2="224" y2="160" stroke-width="0.9"/>
