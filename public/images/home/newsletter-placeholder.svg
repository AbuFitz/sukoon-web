<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2bba9"/>
      <stop offset="60%" stop-color="#cec7b4"/>
      <stop offset="100%" stop-color="#c4bd9e"/>
    </linearGradient>
    <radialGradient id="warmglow" cx="38%" cy="28%" r="54%">
      <stop offset="0%" stop-color="#ddd5be" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c2bba9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightglow" cx="78%" cy="60%" r="36%">
      <stop offset="0%" stop-color="#cac3b0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="bshineA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0bab0"/>
      <stop offset="38%" stop-color="#ddd8cc"/>
      <stop offset="100%" stop-color="#c8c2b6"/>
    </linearGradient>
    <linearGradient id="jarGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cac4b8"/>
      <stop offset="50%" stop-color="#e0dad0"/>
      <stop offset="100%" stop-color="#ccc6ba"/>
    </linearGradient>
    <linearGradient id="lbl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eee8d8"/>
      <stop offset="100%" stop-color="#e6e0d0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="440" fill="url(#bg)"/>
  <rect width="720" height="440" fill="url(#warmglow)"/>
  <rect width="720" height="440" fill="url(#rightglow)"/>

  <!-- Table surface -->
  <rect x="0" y="336" width="720" height="104" fill="#b0a898" opacity="0.32"/>
  <rect x="0" y="334" width="720" height="3" fill="#c8c0ae" opacity="0.55"/>
  <rect x="0" y="337" width="720" height="2" fill="#9c9488" opacity="0.3"/>

  <!-- Linen cloth drape -->
  <path d="M0 354 C70 346 140 360 220 350 C300 340 380 356 460 346 C540 336 640 350 720 344 L720 390 L0 390Z" fill="#d4ccba" opacity="0.25"/>

  <!-- TALL BOTTLE — centre-left -->
  <g>
    <ellipse cx="270" cy="344" rx="38" ry="8" fill="#8a8070" opacity="0.2"/>
    <rect x="244" y="96" width="52" height="240" rx="5" fill="url(#bshineA)" stroke="#a8a298" stroke-width="1.1"/>
    <path d="M244 96 C244 76 255 65 270 62 C285 65 296 76 296 96Z" fill="#ccc6ba" stroke="#a8a298" stroke-width="1.1"/>
    <rect x="261" y="24" width="18" height="40" rx="3" fill="#c8c2b6" stroke="#a8a298" stroke-width="1.1"/>
    <rect x="256" y="14" width="28" height="13" rx="3" fill="#5e6e56" stroke="#4e5e46" stroke-width="1"/>
    <rect x="262" y="19" width="16" height="7" rx="1.5" fill="#6a7a62"/>
    <!-- label -->
    <rect x="250" y="136" width="40" height="68" rx="2" fill="url(#lbl)" stroke="#ccc6b6" stroke-width="0.8"/>
    <text x="270" y="157" text-anchor="middle" font-family="Georgia,serif" font-size="6.5" fill="#888078" letter-spacing="2.5" opacity="0.95">SUKOON</text>
    <line x1="255" y1="163" x2="285" y2="163" stroke="#cac4b4" stroke-width="0.6" opacity="0.8"/>
    <text x="270" y="174" text-anchor="middle" font-family="Georgia,serif" font-size="5" fill="#9a9488" letter-spacing="1.8" opacity="0.85">DAILY SOLACE</text>
    <text x="270" y="184" text-anchor="middle" font-family="Georgia,serif" font-size="4.5" fill="#9a9488" letter-spacing="1.4" opacity="0.75">FLUID</text>
    <line x1="256" y1="191" x2="284" y2="191" stroke="#cac4b4" stroke-width="0.5" opacity="0.6"/>
    <text x="270" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="4.5" fill="#aea8a0" letter-spacing="0.8" opacity="0.7">30 ml</text>
    <!-- highlight -->
    <rect x="248" y="102" width="7" height="140" rx="3.5" fill="white" opacity="0.17"/>
  </g>

  <!-- CREAM JAR — right of bottle -->
  <g>
    <ellipse cx="402" cy="344" rx="42" ry="9" fill="#8a8070" opacity="0.17"/>
    <!-- jar shadow depth -->
    <rect x="360" y="260" width="84" height="78" rx="5" fill="#c4beb2" stroke="#a8a298" stroke-width="1"/>
    <!-- jar body -->
    <rect x="360" y="254" width="84" height="76" rx="5" fill="url(#jarGrad)" stroke="#a8a298" stroke-width="1"/>
    <!-- lid -->
    <ellipse cx="402" cy="254" rx="42" ry="13" fill="#d4cec2" stroke="#a8a298" stroke-width="1"/>
    <ellipse cx="402" cy="252" rx="38" ry="10" fill="#ddd8cc"/>
    <!-- lid label -->
    <ellipse cx="402" cy="252" rx="26" ry="7" fill="url(#lbl)" opacity="0.85"/>
    <text x="402" y="254.5" text-anchor="middle" font-family="Georgia,serif" font-size="5" fill="#888078" letter-spacing="2" opacity="0.85">SUKOON</text>
    <!-- body label -->
    <rect x="368" y="272" width="68" height="46" rx="2" fill="url(#lbl)" opacity="0.75"/>
    <text x="402" y="289" text-anchor="middle" font-family="Georgia,serif" font-size="6" fill="#888078" letter-spacing="2" opacity="0.9">SUKOON</text>
    <line x1="374" y1="295" x2="430" y2="295" stroke="#cac4b4" stroke-width="0.6" opacity="0.7"/>
    <text x="402" y="305" text-anchor="middle" font-family="Georgia,serif" font-size="4.5" fill="#9a9488" letter-spacing="1.5" opacity="0.8">FACE BALM</text>
    <rect x="363" y="260" width="5" height="58" rx="2.5" fill="white" opacity="0.14"/>
  </g>

  <!-- DRIED BOTANICAL SPRIG -->
  <g opacity="0.4" stroke="#80745e" stroke-linecap="round" fill="none">
    <line x1="180" y1="336" x2="202" y2="88" stroke-width="1.5"/>
    <path d="M202 88 C185 72 170 68 160 54 C170 66 186 72 202 88Z" fill="#908070" fill-opacity="0.55" stroke-width="0"/>
    <path d="M196 144 C178 130 162 134 152 120 C162 130 178 132 196 144Z" fill="#908070" fill-opacity="0.5" stroke-width="0"/>
    <path d="M193 198 C210 182 224 180 234 166 C222 178 208 182 193 198Z" fill="#908070" fill-opacity="0.46" stroke-width="0"/>
    <path d="M190 252 C172 238 158 242 148 228 C158 238 172 240 190 252Z" fill="#908070" fill-opacity="0.42" stroke-width="0"/>
    <path d="M188 302 C205 288 218 286 228 272 C216 284 202 288 188 302Z" fill="#908070" fill-opacity="0.38" stroke-width="0"/>
    <line x1="195" y1="168" x2="180" y2="154" stroke-width="1"/>
    <line x1="191" y1="222" x2="206" y2="208" stroke-width="1"/>
    <line x1="189" y1="272" x2="175" y2="258" stroke-width="1"/>
  </g>

  <!-- Small pebble group -->
  <ellipse cx="480" cy="347" rx="30" ry="14" fill="#b8b2a4" opacity="0.45"/>
  <ellipse cx="480" cy="344" rx="28" ry="12" fill="#c4beb0" opacity="0.35"/>
  <ellipse cx="505" cy="348" rx="18" ry="9" fill="#bab4a6" opacity="0.4"/>

  <!-- Right edge botanical accent -->
  <g opacity="0.2" stroke="#7a7060" stroke-linecap="round" fill="none">
    <line x1="660" y1="440" x2="680" y2="295" stroke-width="1.3"/>
    <path d="M680 295 C698 279 710 272 718 258 C708 270 695 278 680 295Z" fill="#887e6c" fill-opacity="0.5" stroke-width="0"/>
    <path d="M674 340 C658 328 646 332 638 320 C646 328 658 330 674 340Z" fill="#887e6c" fill-opacity="0.45" stroke-width="0"/>
  </g>

  <!-- Bottle shadow cast on table -->
  <ellipse cx="270" cy="347" rx="34" ry="7" fill="#9a9082" opacity="0.14"/>

  <!-- Vignette -->
  <radialGradient id="vig" cx="50%" cy="50%" r="72%">
    <stop offset="52%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#7a6e5a" stop-opacity="0.3"/>
  </radialGradient>
  <rect width="720" height="440" fill="url(#vig)"/>
</svg>
