<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="48%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#c0b09a"/>
      <stop offset="48%" stop-color="#a89880"/>
      <stop offset="100%" stop-color="#6a5a46"/>
    </radialGradient>
    <radialGradient id="light" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#e8dcc6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e8dcc6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a120a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a120a" stop-opacity="0.52"/>
    </radialGradient>
    <linearGradient id="tbl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8a890"/>
      <stop offset="100%" stop-color="#7a6a54"/>
    </linearGradient>
    <linearGradient id="btl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ccc0aa"/>
      <stop offset="28%" stop-color="#eae0cc"/>
      <stop offset="68%" stop-color="#dcd2be"/>
      <stop offset="100%" stop-color="#ada090"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#506048"/>
      <stop offset="50%" stop-color="#6e7c64"/>
      <stop offset="100%" stop-color="#424e3c"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="drop"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1a120a" flood-opacity="0.28"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="380" cy="240" rx="400" ry="320" fill="url(#light)" filter="url(#blur)"/>

  <!-- Table surface -->
  <rect x="0" y="370" width="800" height="230" fill="url(#tbl)" opacity="0.32"/>
  <line x1="0" y1="370" x2="800" y2="370" stroke="#c8b898" stroke-width="0.8" opacity="0.4"/>

  <!-- Main tall bottle -->
  <g filter="url(#drop)" transform="translate(290, 80)">
    <rect x="0" y="62" width="84" height="440" rx="9" fill="url(#btl)"/>
    <rect x="9" y="76" width="11" height="414" rx="5.5" fill="white" opacity="0.18"/>
    <rect x="24" y="76" width="4" height="414" rx="2" fill="white" opacity="0.08"/>
    <rect x="73" y="62" width="11" height="440" rx="5.5" fill="#907e64" opacity="0.3"/>
    <path d="M0 62 Q0 40 13 32 L71 32 Q84 40 84 62Z" fill="url(#btl)"/>
    <rect x="7" y="0" width="70" height="38" rx="7" fill="url(#cap)"/>
    <rect x="13" y="4" width="9" height="30" rx="4.5" fill="white" opacity="0.14"/>
    <!-- Label -->
    <rect x="10" y="148" width="64" height="190" rx="4" fill="#faf6ee" opacity="0.95"/>
    <text x="42" y="186" font-family="Georgia,serif" font-size="8.5" fill="#2a2418" text-anchor="middle" letter-spacing="4">SUKOON</text>
    <line x1="14" y1="193" x2="70" y2="193" stroke="#2a2418" stroke-width="0.5" opacity="0.35"/>
    <text x="42" y="210" font-family="Georgia,serif" font-size="5.5" fill="#4a4030" text-anchor="middle" letter-spacing="2">DAILY SOLACE</text>
    <text x="42" y="222" font-family="Georgia,serif" font-size="5.5" fill="#4a4030" text-anchor="middle" letter-spacing="1.5">FLUID</text>
    <path d="M36 268 C36 254 42 240 42 228" stroke="#6a5e46" stroke-width="0.8" fill="none"/>
    <path d="M36 262 C30 252 28 242 33 238 C37 244 37 256 36 262Z" fill="#6a5e46" opacity="0.6"/>
    <path d="M36 268 C42 258 44 248 39 244 C35 250 35 262 36 268Z" fill="#6a5e46" opacity="0.6"/>
    <text x="42" y="290" font-family="Georgia,serif" font-size="5" fill="#8a7a60" text-anchor="middle" letter-spacing="1">30 ML</text>
  </g>

  <!-- Cream jar -->
  <g transform="translate(406, 310)" opacity="0.9" filter="url(#drop)">
    <ellipse cx="55" cy="18" rx="55" ry="18" fill="#d8cebb"/>
    <rect x="0" y="18" width="110" height="90" rx="6" fill="#d4caba"/>
    <ellipse cx="55" cy="108" rx="55" ry="14" fill="#c4b8a6"/>
    <!-- Lid -->
    <ellipse cx="55" cy="14" rx="48" ry="14" fill="#e0d6c6"/>
    <ellipse cx="55" cy="10" rx="44" ry="12" fill="#e8dece"/>
    <rect x="12" y="48" width="86" height="56" rx="3" fill="#faf6ee" opacity="0.88"/>
    <text x="55" y="72" font-family="Georgia,serif" font-size="7.5" fill="#2a2418" text-anchor="middle" letter-spacing="3.5">SUKOON</text>
    <line x1="16" y1="78" x2="94" y2="78" stroke="#2a2418" stroke-width="0.4" opacity="0.3"/>
    <text x="55" y="92" font-family="Georgia,serif" font-size="5" fill="#4a4030" text-anchor="middle" letter-spacing="1.5">FACE BALM</text>
  </g>

  <!-- Dried botanical -->
  <g opacity="0.58" transform="translate(235, 290)">
    <path d="M0 120 C6 90 14 60 22 30" stroke="#5a4e38" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <path d="M22 30 C14 22 6 26 3 34 C10 40 20 36 22 30Z" fill="#5a4e38"/>
    <path d="M20 44 C28 37 34 41 32 50 C26 55 19 50 20 44Z" fill="#5a4e38" opacity="0.78"/>
    <path d="M16 62 C8 55 4 60 5 68 C12 73 18 68 16 62Z" fill="#5a4e38" opacity="0.7"/>
    <path d="M14 80 C22 73 28 78 26 86 C20 90 14 86 14 80Z" fill="#5a4e38" opacity="0.62"/>
    <path d="M12 100 C3 94 -1 100 0 107 C7 112 14 108 12 100Z" fill="#5a4e38" opacity="0.54"/>
  </g>

  <!-- Pebbles -->
  <ellipse cx="258" cy="382" rx="14" ry="8" fill="#9a8a70" opacity="0.5"/>
  <ellipse cx="276" cy="388" rx="10" ry="6" fill="#887a62" opacity="0.45"/>
  <ellipse cx="244" cy="386" rx="9" ry="5" fill="#a8987a" opacity="0.4"/>

  <rect width="800" height="600" fill="url(#vig)"/>
</svg>
