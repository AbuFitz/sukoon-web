  <!-- Pebble -->
  <ellipse cx="370" cy="334" rx="28" ry="15" fill="#c8c3b9" opacity="0.4"/>
  <ellipse cx="370" cy="331" rx="28" ry="15" fill="#d4cfc5" opacity="0.3"/>

  <!-- Shadows -->
  <ellipse cx="289" cy="326" rx="40" ry="8" fill="#9a9590" opacity="0.12"/>
  <ellipse cx="430" cy="322" rx="44" ry="8" fill="#9a9590" opacity="0.1"/>
