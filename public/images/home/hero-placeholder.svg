<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Warm amber-sand base -->
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8a898"/>
      <stop offset="45%" stop-color="#ccc0ae"/>
      <stop offset="100%" stop-color="#d8ccba"/>
    </linearGradient>
    <!-- Warm light bloom from upper left -->
    <radialGradient id="bloom1" cx="22%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#ddd0b8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#b8a898" stop-opacity="0"/>
    </radialGradient>
    <!-- Secondary warm glow mid-right -->
    <radialGradient id="bloom2" cx="72%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#c8b89e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#b0a090" stop-opacity="0"/>
    </radialGradient>
    <!-- Deep shadow bottom -->
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="60%" stop-color="#a09080" stop-opacity="0"/>
      <stop offset="100%" stop-color="#806858" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Base warm ground -->
  <rect width="1440" height="860" fill="url(#base)"/>
  <rect width="1440" height="860" fill="url(#bloom1)"/>
  <rect width="1440" height="860" fill="url(#bloom2)"/>

  <!-- Warm horizon band -->
  <rect x="0" y="560" width="1440" height="300" fill="#a09080" opacity="0.2"/>
  <rect x="0" y="620" width="1440" height="240" fill="#907860" opacity="0.15"/>

  <!-- Background haze layers for depth -->
  <ellipse cx="900" cy="300" rx="480" ry="320" fill="#c4b49e" opacity="0.18"/>
  <ellipse cx="600" cy="500" rx="560" ry="200" fill="#b8a890" opacity="0.1"/>

  <!-- Main botanical stem — tall, right half -->
  <g opacity="0.55" stroke="#6b5e50" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1055 870 C1062 790 1045 700 1082 615 C1118 534 1102 448 1094 362 C1086 278 1114 195 1096 112 C1084 58 1072 28 1068 0" stroke-width="2.2"/>

    <!-- Leaf cluster 1 — upper -->
    <path d="M1082 615 C1122 588 1165 575 1190 548" stroke-width="1.5"/>
    <path d="M1082 615 C1122 592 1162 579 1190 548 C1165 580 1120 594 1082 615Z" fill="#7a6e5c" fill-opacity="0.32" stroke-width="0"/>

    <path d="M1088 515 C1050 490 1018 498 998 475" stroke-width="1.5"/>
    <path d="M998 475 C1018 498 1048 492 1088 515 C1050 494 1018 500 998 475Z" fill="#7a6e5c" fill-opacity="0.3" stroke-width="0"/>

    <!-- Leaf cluster 2 -->
    <path d="M1094 420 C1140 394 1178 386 1204 362" stroke-width="1.4"/>
    <path d="M1094 420 C1138 398 1176 390 1204 362 C1178 390 1136 402 1094 420Z" fill="#7a6e5c" fill-opacity="0.28" stroke-width="0"/>

    <path d="M1090 320 C1050 298 1018 304 998 283" stroke-width="1.4"/>
    <path d="M998 283 C1018 304 1048 300 1090 320 C1050 302 1018 306 998 283Z" fill="#7a6e5c" fill-opacity="0.26" stroke-width="0"/>

    <!-- Leaf cluster 3 -->
    <path d="M1094 228 C1140 202 1176 196 1200 172" stroke-width="1.3"/>
    <path d="M1094 228 C1138 206 1174 200 1200 172 C1175 198 1136 210 1094 228Z" fill="#7a6e5c" fill-opacity="0.24" stroke-width="0"/>

    <path d="M1082 148 C1048 126 1018 132 1000 112" stroke-width="1.3"/>
    <path d="M1000 112 C1018 132 1046 128 1082 148 C1048 130 1018 134 1000 112Z" fill="#7a6e5c" fill-opacity="0.22" stroke-width="0"/>
  </g>

  <!-- Second thinner stem — further right, more transparent -->
  <g opacity="0.28" stroke="#6b5e50" fill="none" stroke-linecap="round">
    <path d="M1258 870 C1268 798 1248 718 1288 645 C1326 576 1308 492 1298 412" stroke-width="1.6"/>
    <path d="M1288 645 C1328 620 1368 612 1392 589" stroke-width="1.1"/>
    <path d="M1293 545 C1258 524 1230 530 1210 508" stroke-width="1.1"/>
    <path d="M1298 450 C1336 426 1372 420 1396 398" stroke-width="1.0"/>
  </g>

  <!-- Left edge organic shadow -->
  <rect x="0" y="0" width="180" height="860" fill="#8a7868" opacity="0.14"/>

  <!-- Fine ground surface -->
  <rect x="0" y="780" width="1440" height="80" fill="url(#shadow)"/>

  <!-- Subtle warm vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
    <stop offset="60%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#6a5848" stop-opacity="0.22"/>
  </radialGradient>
  <rect width="1440" height="860" fill="url(#vignette)"/>
</svg>
