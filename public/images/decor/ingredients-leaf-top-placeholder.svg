<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 415" fill="none" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Botanical branch — top-right corner decoration -->
  <!-- Dark sage line-art, semi-transparent, for white/light backgrounds -->
